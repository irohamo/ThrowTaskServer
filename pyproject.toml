[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "throwtask-server"
version = "0.2.0"
description = "ThrowTask self-hosted task API, CLI, and MCP adapter"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "keyring>=25,<27",
  "mcp>=2,<3",
  "pydantic>=2.12,<3",
  "uvicorn>=0.35,<1",
]

[project.scripts]
throwtask-server = "throwtask.server:main"
throwtask-admin = "throwtask.admin:main"
throwtask = "throwtask.cli:main"
throwtask-mcp = "throwtask.mcp_server:main"
# Compatibility for existing local CLI/MCP launch configurations.
toidone-server = "throwtask.server:main"
toidone-admin = "throwtask.admin:main"
toidone = "throwtask.cli:main"
toidone-mcp = "throwtask.mcp_server:main"
mytodo-server = "throwtask.server:main"
mytodo-admin = "throwtask.admin:main"
mytodo = "throwtask.cli:main"
mytodo-mcp = "throwtask.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-third-party = ["mcp"]
known-first-party = ["throwtask", "toidone"]

[tool.hatch.build.targets.wheel]
packages = ["src/throwtask", "src/toidone"]
