[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "toidone-server"
version = "0.1.0"
description = "ToiDone self-hosted task API, CLI, and MCP adapter"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "keyring>=25,<27",
  "mcp>=2,<3",
  "pydantic>=2.12,<3",
  "uvicorn>=0.35,<1",
]

[project.scripts]
toidone-server = "toidone.server:main"
toidone-admin = "toidone.admin:main"
toidone = "toidone.cli:main"
toidone-mcp = "toidone.mcp_server:main"
# Compatibility for existing local CLI/MCP launch configurations.
mytodo-server = "toidone.server:main"
mytodo-admin = "toidone.admin:main"
mytodo = "toidone.cli:main"
mytodo-mcp = "toidone.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-third-party = ["mcp"]
known-first-party = ["toidone"]

[tool.hatch.build.targets.wheel]
packages = ["src/toidone"]
